name: Daily data
on:
  schedule:
    - cron: '0,30 1,2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start search stack
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          for i in $(seq 1 60); do
            code_s=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/search?q=test&format=json' || true)
            code_f=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3002/health' || true)
            if [ "$code_s" = "200" ] && { [ "$code_f" = "200" ] || [ "$code_f" = "404" ]; }; then break; fi
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml ps
      - name: Query and write data.json
        env:
          FIRECRAWL_URL: http://127.0.0.1:3002
          SEARXNG_URL: http://127.0.0.1:8080
          SEARCH_QUERIES: searxng json api,firecrawl self host,llm web search
        run: python deploy/daily_update.py
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged"
          else
            git commit -m "chore: refresh data.json"
            git push
          fi